<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Полученные брифы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marck+Script&family=Playfair+Display:ital,wght@0,500;0,600&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16242B; --cream:#F6F1E7; --cream-2:#ECE1CC;
    --amber:#B07C3F; --amber-deep:#8C6130; --line: rgba(22,36,43,0.16);
    --text:#2A2420; --text-soft:#5C5346;
  }
  *{box-sizing:border-box;}
  body{ margin:0; font-family:'PT Serif', serif; background:var(--cream); color:var(--text); line-height:1.6; }
  .wrap{ max-width:680px; margin:0 auto; padding:72px 24px 100px; }
  .top{ text-align:center; margin-bottom:56px; }
  .top .script{ font-family:'Marck Script', cursive; font-size:34px; margin-bottom:8px; }
  .top .private{
    display:inline-block; margin-top:14px; font-size:12px; color:var(--amber-deep);
    border:1px solid var(--line); border-radius:999px; padding:6px 16px;
  }
  .card{ background:#fff; border:1px solid var(--line); padding:32px 28px; margin-bottom:28px; }
  .card h2{ font-family:'Playfair Display', serif; font-style:italic; font-weight:500; font-size:24px; margin:0 0 4px; }
  .card .ts{ font-size:13px; color:var(--text-soft); font-style:italic; margin-bottom:20px; }
  .row{ padding:12px 0; border-bottom:1px solid var(--line); }
  .row:last-child{ border-bottom:none; }
  .row .l{ font-weight:700; font-size:14px; margin-bottom:4px; }
  .row .v{ font-size:15px; color:var(--text); }
  .empty{ text-align:center; color:var(--text-soft); font-style:italic; padding:60px 0; }
  .refresh{
    display:block; margin:12px auto 0; padding:13px 34px; background:var(--amber); color:#fff;
    border:none; border-radius:999px; font-family:'PT Serif',serif; font-style:italic; font-size:15px; cursor:pointer;
  }
  .refresh:hover{ background:var(--amber-deep); }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="script">Полученные брифы</div>
    <div class="private">только для вас</div>
  </div>

  <div id="list"><p class="empty">Загружаем...</p></div>
  <button class="refresh" id="refreshBtn">Обновить</button>
</div>

<script>
  async function render(){
    var list = document.getElementById('list');
    try{
      var res = await window.storage.get('brief_submissions', true);
      var subs = (res && res.value) ? JSON.parse(res.value) : [];
      if(!subs.length){
        list.innerHTML = '<p class="empty">Пока никто не отправил бриф.</p>';
        return;
      }
      subs.sort(function(a,b){ return b.ts - a.ts; });
      list.innerHTML = subs.map(function(sub){
        var date = new Date(sub.ts).toLocaleString('ru-RU', { day:'numeric', month:'long', year:'numeric', hour:'2-digit', minute:'2-digit' });
        var rows = sub.answers.map(function(a){
          return '<div class="row"><div class="l">' + esc(a.label) + '</div><div class="v">' + esc(a.value) + '</div></div>';
        }).join('');
        return '<div class="card"><h2>' + esc(sub.title) + '</h2><div class="ts">' + date + '</div>' + rows + '</div>';
      }).join('');
    }catch(err){
      list.innerHTML = '<p class="empty">Пока никто не отправил бриф.</p>';
    }
  }
  function esc(s){ return String(s).replace(/</g,'&lt;'); }
  render();
  document.getElementById('refreshBtn').addEventListener('click', render);
</script>
</body>
</html>
