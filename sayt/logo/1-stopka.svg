<svg viewBox="0 0 470 252" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Про двоих — сайты-приглашения на свадьбу">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&amp;display=swap');
      @font-face{
        font-family:'CruinnDesc';
        src:url(data:font/woff2;base64,) format('woff2');
        font-weight:400; font-display:swap;
      }
      .word{ font-family:'Cormorant Garamond', Georgia, 'Times New Roman', serif; font-weight:600; font-size:118px; letter-spacing:0.05em; }
      .desc{ font-family:'CruinnDesc','Golos Text',system-ui,sans-serif; font-size:16px; letter-spacing:0.34em; }
    </style>
    <mask id="weave1">
      <rect x="0" y="0" width="470" height="252" fill="#fff"/>
      <circle cx="267" cy="106" r="13" fill="#000"/>
    </mask>
  </defs>

  <g fill="#33302E">
    <text class="word" x="185" y="114" text-anchor="end">ПР</text>
    <text class="word" x="185" y="187" text-anchor="end">ДВ</text>
    <text class="word" x="299" y="187" text-anchor="start">ИХ</text>
  </g>

  <circle cx="240" cy="150" r="52" fill="none" stroke="#33302E" stroke-width="5"/>
  <circle cx="240" cy="76" r="40" fill="none" stroke="#C08A82" stroke-width="5" mask="url(#weave1)"/>

  <text class="desc" x="36" y="234" fill="#6E625B">САЙТЫ-ПРИГЛАШЕНИЯ НА СВАДЬБУ</text>
</svg>
