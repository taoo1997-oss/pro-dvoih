name: Сборка и деплой витрины на GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pillow нужен build_sayt.py: режет превью работ и обложку под srcset
      - name: Собрать сайт
        run: |
          pip install pillow
          python САЙТ/build_sayt.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: САЙТ/dist

      - id: deploy
        uses: actions/deploy-pages@v4
