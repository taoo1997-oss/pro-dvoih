  .guest-entry{ padding:16px 4px; border-bottom:1px solid var(--line); }

  .g-extra{ font-size:14px; color:var(--text-soft); margin-top:4px; }
  .g-note{ font-size:13px; color:var(--text-soft); font-style:italic; margin-top:4px; }
  .g-declined .g-main{ color:var(--text-soft); text-decoration:line-through; }
  .empty{ text-align:center; color:var(--text-soft); font-style:italic; padding:40px 0; }
  .refresh{
